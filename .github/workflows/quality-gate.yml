name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [backend, frontend, browser, runtime-isolation]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install backend dependencies
        run: uv sync --project backend --frozen
      - name: Install frontend dependencies
        working-directory: prototype
        run: npm ci
      - name: Install browser
        if: matrix.gate == 'browser'
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Run shared gate
        run: ./scripts/quality-gate.sh "${{ matrix.gate }}"
