name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: backend
            os: macos-15
          - gate: frontend
            os: ubuntu-latest
          - gate: browser
            os: ubuntu-latest
          - gate: runtime-isolation
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install backend dependencies
        if: matrix.gate != 'backend'
        run: uv sync --project backend --frozen --extra database
      - name: Install backend macOS dependencies
        if: matrix.gate == 'backend'
        run: |
          uv sync --project backend --frozen --extra database --extra macos --extra transcription --extra diarization
          command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install frontend dependencies
        working-directory: prototype
        run: npm ci
      - name: Install browser
        if: matrix.gate == 'browser'
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Run shared gate
        run: ./scripts/quality-gate.sh "${{ matrix.gate }}"
