[project]
name = "audio-memory-backend"
version = "0.1.0"
description = "Local backend for the Audio Memory macOS demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alibabacloud-oss-v2>=1.3.2,<2",
  "cryptography>=45,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
database = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "greenlet>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
macos = [
  "pyobjc-framework-Security>=11.1,<12",
]
transcription = [
  "mlx-whisper>=0.4,<1",
]
diarization = [
  "sherpa-onnx>=1.10.28,<2",
  "sherpa-onnx-core>=1.10.28,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
